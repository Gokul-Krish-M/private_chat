<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Margins · Reading library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5d50'/%3E%3Cpath d='M9 23V9l7 8 7-8v14' fill='none' stroke='%23fbfaf7' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#" id="home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 23V9l7 8 7-8v14"/></svg>
      Margins
    </a>
    <nav class="topnav" aria-label="Sections">
      <a href="#">Library</a>
      <a href="#">Essays</a>
      <a href="#">Guides</a>
    </nav>
    <form id="search" class="search" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" name="q" placeholder="Search the library…" aria-label="Search"
             maxlength="2000" autocomplete="off" autocorrect="off" spellcheck="false">
    </form>
    <button id="account" class="account" type="button">Sign in</button>
  </header>

  <div class="layout">
    <aside class="nav" aria-label="Library">
      <h3>Reading list</h3>
      <ul id="articles" class="navlist"></ul>

      <section id="collections" hidden>
        <h3>Collections</h3>
        <ul id="rooms" class="navlist"></ul>
        <button id="new-room" class="linkbtn" type="button">+ New collection</button>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </aside>

    <main id="article" class="article"></main>

    <aside class="rail" aria-label="Sponsored">
      <div class="rail-head">
        <span>Sponsored</span>
        <button id="adchoices" class="adchoices" type="button" title="Why am I seeing these ads?">
          AdChoices
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.5 5v6l4.5-3z"/></svg>
        </button>
      </div>
      <div id="ads" class="ads"></div>
    </aside>
  </div>

  <footer class="footer">
    <span>© Margins Library</span>
    <a href="#">About</a>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
  </footer>

  <dialog id="modal" class="modal"></dialog>
</body>
</html>
